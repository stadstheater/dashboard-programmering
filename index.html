<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coulisse · Programmeringsdashboard</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <script>
      try {
        var opgeslagen = JSON.parse(localStorage.getItem('coulisse-dashboard-v2') || '{}').state || {}
        if (opgeslagen.thema === 'donker') document.documentElement.classList.add('donker')
        if ((opgeslagen.modus || 'eenvoudig') === 'eenvoudig') document.documentElement.classList.add('eenvoudig')
      } catch (e) {}
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
